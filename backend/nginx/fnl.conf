# Free-Networking-labs の入口（単一オリジン化）。docs/direction.md 2026-10-10 参照。
# ブラウザ → nginx(443, HTTPS) → 各サービス（ホスト上の127.0.0.1）
#   /login, /api/ → clab-api-server (8090, HTTPS自己署名)
#   /console      → console-proxy   (8082, WebSocket)
#   /ovs/         → ovs-helper      (8083, 先頭の/ovsを除去して中継)
#   /capture/     → capture-proxy   (8084, HTTPS自己署名)
#   /             → フロントの静的ファイル（vite build の出力）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name fnl.sotsuken.net fnl _;

    ssl_certificate     /etc/nginx/ssl/fnl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/fnl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/free-networking-labs;
    index index.html;

    # 共通：WebSocketと長時間接続（ターミナル、NDJSONのevents、noVNC）を切らない
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;

    # clab-api-server（自己署名のため上流の証明書検証はしない）
    location = /login {
        proxy_pass https://127.0.0.1:8090;
        proxy_ssl_verify off;
        proxy_set_header Origin "";   # 同一オリジンなのでCORS判定を回避
    }
    location /api/ {
        proxy_pass https://127.0.0.1:8090;
        proxy_ssl_verify off;
        proxy_set_header Origin "";
    }

    # console-proxy（パスはそのまま /console?sessionId=...）
    location /console {
        proxy_pass http://127.0.0.1:8082;
    }

    # ovs-helper（/ovs/link → /link）
    location /ovs/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_set_header Origin "";
    }

    # capture-proxy（/capture/<token>/... をそのまま渡す）
    location /capture/ {
        proxy_pass https://127.0.0.1:8084;
        proxy_ssl_verify off;
    }

    # フロント（SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
